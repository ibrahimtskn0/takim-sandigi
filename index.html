<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geliştiriciler için ücretsiz ve reklamsız pratik araçlar.">
    <title>Takım Sandığı</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/tools.css">
    <!-- type="module" import ve export kullanmamızı sağlar. -->
    <script type="module" src="assets/js/app.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <a href="#/" class="logo">Takım Sandığı</a>
            <nav aria-label="Araçlar">
                <ul class="nav-list" id="nav-list"></ul>
            </nav>
        </aside>
        <div class="content">
            <header class="topbar">
                <button type="button" class="button menu-toggle" id="menu-toggle" aria-label="Menüyü Aç"
                    aria-controls="sidebar" aria-expanded="false">☰</button>
                <button type="button" class="button" id="theme-toggle">Temayı Değiştir</button>
            </header>
            <main id="main-content" tabindex="-1"></main>
        </div>
    </div>
    <div id="toast-container" aria-live="polite"></div>
</body>

</html>
